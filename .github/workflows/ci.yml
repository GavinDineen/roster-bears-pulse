name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run for the same ref supersedes an in-flight one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # build must not depend on real secrets; these keep any
          # env-guarded code paths from throwing during `next build`.
          DESK_SERVICE_SECRET: ci-placeholder
          CRON_SECRET: ci-placeholder
